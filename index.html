<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Flight Mode Radio</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main>
    <h1>FLIGHT MODE</h1>
    <p>24/7 MUSIC RADIO</p>

    <div id="playerWrap">
      <div id="player"></div>
    </div>

    <h2 id="trackTitle">Press Play</h2>
    <p id="trackArtist">Loading playlist…</p>
    <p id="playerStatus">Preparing player…</p>

    <button id="playBtn">▶</button>
    <button id="prevBtn">⏮</button>
    <button id="nextBtn">⏭</button>

    <input id="volume" type="range" min="0" max="100" value="70">
    <div id="progress"><div id="progressFill"></div></div>
    <div id="visualizer"></div>
    <p>© <span id="year"></span> Flight Mode Radio</p>
  </main>

  <script src="https://www.youtube.com/iframe_api"></script>
  <script src="script.js"></script>
</body>
</html>
